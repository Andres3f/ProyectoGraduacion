version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: optirutas
      POSTGRES_PASSWORD: optirutas_secret
      POSTGRES_DB: optirutas_jalapa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      DATABASE_URL: postgresql://optirutas:optirutas_secret@db:5432/optirutas_jalapa
      SECRET_KEY: super-secret-change-me-in-production
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
